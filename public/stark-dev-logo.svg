<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Preto -->
  <rect width="400" height="200" fill="#000000"/>
  
  <!-- Cubo 3D -->
  <g transform="translate(80, 40)">
    <!-- Face Frente (Verde) -->
    <polygon points="50,80 100,110 100,200 50,170" fill="#10B981"/>
    
    <!-- Face Esquerda (Verde Escuro) -->
    <polygon points="0,50 50,80 50,170 0,140" fill="#059669"/>
    
    <!-- Face Topo (Roxo) -->
    <polygon points="0,50 50,20 150,20 100,50" fill="#6D28D9"/>
    
    <!-- Face Frente Direita (Roxo Claro) -->
    <polygon points="50,20 150,20 150,110 100,80" fill="#7C3AED"/>
    
    <!-- Aresta Direita (Verde) -->
    <polygon points="100,80 150,110 150,200 100,170" fill="#10B981"/>
    
    <!-- Aresta Superior Direita (Roxo) -->
    <polygon points="100,50 150,20 150,110 100,80" fill="#8B5CF6"/>
  </g>
  
  <!-- Texto STARK em Roxo -->
  <text x="20" y="180" font-family="Arial Black, sans-serif" font-size="36" font-weight="bold" fill="#6D28D9">STARK</text>
  
  <!-- Texto DEV em Verde -->
  <text x="210" y="180" font-family="Arial Black, sans-serif" font-size="36" font-weight="bold" fill="#10B981">DEV</text>
</svg>